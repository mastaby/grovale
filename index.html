    <script>if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()));if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('grovale-shell-')).map(key=>caches.delete(key)))}}catch(error){console.warn('Cache refresh unavailable:',error)}})}</script>
    <link rel="stylesheet" href="styles.css?v=20261017-06" />

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js?v=20261017-30"></script><script>new MutationObserver(()=>{document.querySelectorAll('.compact-category-wrap').forEach(card=>{const name=card.querySelector('strong')?.textContent?.trim().toLowerCase(),img=card.querySelector('img');if(!img)return;if(name==='paan corner')img.src='public/paan-corner.png';if(name==='ice creams & more')img.src='public/ice-creams-more.png'})}).observe(document.body,{childList:true,subtree:true});</script><script src="home-brand.js?v=20261004-01"></script><script type="module" src="customer-role-guard.js?v=20261013-12"></script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
  </body>
